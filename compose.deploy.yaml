name: platform-lab-deploy

services:
  postgres:
    extends:
      file: compose.yaml
      service: postgres
    ports: !reset []
    restart: unless-stopped
    networks: [database]
    mem_limit: 512m
    cpus: 1
    pids_limit: 200

  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=1770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1
    pids_limit: 200
    stop_grace_period: 30s
    environment:
      SPRING_PROFILES_ACTIVE: deploy
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-platform_lab}
      DB_USERNAME: platform_runtime
      DB_PASSWORD: ${DB_PASSWORD:?Set runtime-only DB_PASSWORD}
      PLATFORM_SECURITY_USERS_0_USERNAME: ${DEPLOY_OPERATOR_USERNAME:?Set DEPLOY_OPERATOR_USERNAME}
      PLATFORM_SECURITY_USERS_0_PASSWORDHASH: ${DEPLOY_OPERATOR_PASSWORD_HASH:?Set DEPLOY_OPERATOR_PASSWORD_HASH}
      PLATFORM_SECURITY_USERS_0_ROLES: OPERATOR
    depends_on:
      postgres:
        condition: service_healthy
    networks: [api, database]

  migration:
    profiles: [migration]
    build: ./backend
    restart: "no"
    entrypoint:
      - java
      - -Dloader.main=io.github.dcfaight.platformlab.DatabaseMigration
      - -cp
      - /app/app.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      MIGRATION_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-platform_lab}
      MIGRATION_DB_USERNAME: platform_migration
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]

  frontend:
    build: ./frontend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=1770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    ports:
      - "127.0.0.1:${HTTPS_PORT:-8443}:8443"
    volumes:
      - type: bind
        source: ${TLS_CERT_FILE:?Set TLS_CERT_FILE to an absolute PEM certificate path}
        target: /run/tls/tls.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_KEY_FILE:?Set TLS_KEY_FILE to an absolute PEM private key path}
        target: /run/tls/tls.key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge, api]

networks:
  edge:
  api:
    internal: true
  database:
    internal: true

volumes:
  postgres_data:
