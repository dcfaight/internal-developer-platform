spring:
  application:
    name: developer-platform-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/platform_lab}
    username: ${DB_USERNAME:platform_runtime}
    password: ${DB_PASSWORD}
  flyway:
    enabled: false
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false

server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

platform:
  worker:
    enabled: ${WORKER_ENABLED:false}
    poll-delay-ms: 1000
    lease-duration: 30s
    max-attempts: 5
    retry-backoff: 2s
    readiness-poll-interval: 5s
    readiness-timeout: 5m
