apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-lab
resources:
  - ../../kubernetes
images:
  - name: platform-lab-backend
    newName: docker.io/library/platform-lab-backend
    digest: sha256:8e601480ced03a127d658006cccdffce6c46817463f799b67de98d64661b2811
  - name: platform-lab-frontend
    newName: docker.io/library/platform-lab-frontend
    digest: sha256:3816369fcac1a70f1e6556c7b9dbaa7f8a90f0375d2f6a6ce54c509074d34bc6
patches:
  - patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: platform-lab
      $patch: delete
  - patch: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: postgres-data
      $patch: delete
  - patch: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: platform-worker
        namespace: platform-lab
      $patch: delete
  - patch: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: platform-lab-worker
      $patch: delete
  - patch: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: platform-lab-worker
      $patch: delete
  - target:
      kind: Deployment
      name: backend
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        strategy:
          type: Recreate
  - target:
      kind: ConfigMap
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
