apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-lab
resources:
  - ../../kubernetes
images:
  - name: platform-lab-backend
    newName: docker.io/library/platform-lab-backend
    digest: sha256:c7e66463b7ea67cbdc06e225f39482b7b43b209f37ecf12125e9cc32ad1aa10f
  - name: platform-lab-frontend
    newName: docker.io/library/platform-lab-frontend
    digest: sha256:9f6ae09bcc76b786ced130ef2e11d11976fe4e97bd62dfd99934dfdc8ee6bb06
patches:
  - patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: platform-lab
      $patch: delete
  - patch: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: postgres-data
      $patch: delete
  - patch: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: platform-worker
        namespace: platform-lab
      $patch: delete
  - patch: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: platform-lab-worker
      $patch: delete
  - patch: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: platform-lab-worker
      $patch: delete
  - target:
      kind: Deployment
      name: backend
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        strategy:
          type: Recreate
  - target:
      kind: ConfigMap
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
