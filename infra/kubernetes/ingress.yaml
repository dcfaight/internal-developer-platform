apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [platform-test.local]
      secretName: platform-tls
  rules:
    - host: platform-test.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
